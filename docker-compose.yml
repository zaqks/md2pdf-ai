services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: md2pdf
      POSTGRES_PASSWORD: md2pdf_password
      POSTGRES_DB: md2pdf
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U md2pdf"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - ./services/app:/app
      - /app/node_modules

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - 8080:7860
    env_file:
      - .env
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
